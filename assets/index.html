<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesi SVG Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#12132d" />
            <stop offset="60%" stop-color="#070815" />
            <stop offset="100%" stop-color="#030308" />
          </radialGradient>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#00f2fe" />
          </linearGradient>
          <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
        </defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <rect x="16" y="16" width="480" height="480" fill="url(#bgGrad)" rx="100" stroke="#1f2245" stroke-width="4" />
        <rect x="28" y="28" width="456" height="456" fill="none" rx="88" stroke="url(#logoGrad)" stroke-width="1.50"
          opacity="0.25" />
        <line x1="100" y1="28" x2="140" y2="28" stroke="url(#logoGrad)" stroke-width="2" opacity="0.60" />
        <line x1="28" y1="100" x2="28" y2="140" stroke="url(#logoGrad)" stroke-width="2" opacity="0.60" />
        <line x1="372" y1="484" x2="412" y2="484" stroke="url(#logoGrad)" stroke-width="2" opacity="0.60" />
        <line x1="484" y1="372" x2="484" y2="412" stroke="url(#logoGrad)" stroke-width="2" opacity="0.60" />
        <path d="M 360 160 C 200 130, 140 250, 256 256 C 372 262, 312 382, 152 352" fill="none" stroke="url(#logoGrad)"
          stroke-width="28" stroke-linecap="round" filter="url(#glow)" opacity="0.40" />
        <path d="M 360 160 C 200 130, 140 250, 256 256 C 372 262, 312 382, 152 352" fill="none" stroke="url(#logoGrad)"
          stroke-width="10" stroke-linecap="round" />
        <path d="M 360 160 C 200 130, 140 250, 256 256 C 372 262, 312 382, 152 352" fill="none" stroke="#ffffff"
          stroke-width="2" stroke-linecap="round" opacity="0.80" />
        <line x1="360" y1="160" x2="220" y2="130" stroke="#ffffff" stroke-width="1.50" stroke-dasharray="3,4"
          opacity="0.50" />
        <circle cx="220" cy="130" r="5" fill="#ffffff" stroke="#ec4899" stroke-width="2" filter="url(#nodeGlow)" />
        <line x1="256" y1="256" x2="170" y2="230" stroke="#ffffff" stroke-width="1.50" stroke-dasharray="3,4"
          opacity="0.50" />
        <circle cx="170" cy="230" r="5" fill="#ffffff" stroke="#818cf8" stroke-width="2" filter="url(#nodeGlow)" />
        <line x1="256" y1="256" x2="342" y2="282" stroke="#ffffff" stroke-width="1.50" stroke-dasharray="3,4"
          opacity="0.50" />
        <circle cx="342" cy="282" r="5" fill="#ffffff" stroke="#818cf8" stroke-width="2" filter="url(#nodeGlow)" />
        <line x1="152" y1="352" x2="292" y2="382" stroke="#ffffff" stroke-width="1.50" stroke-dasharray="3,4"
          opacity="0.50" />
        <circle cx="292" cy="382" r="5" fill="#ffffff" stroke="#00f2fe" stroke-width="2" filter="url(#nodeGlow)" />
        <rect x="353" y="153" width="14" height="14" fill="#ffffff" stroke="#ec4899" stroke-width="3" rx="2"
          filter="url(#nodeGlow)" />
        <rect x="249" y="249" width="14" height="14" fill="#ffffff" stroke="#818cf8" stroke-width="3" rx="2"
          filter="url(#nodeGlow)" />
        <rect x="145" y="337" width="14" height="14" fill="#ffffff" stroke="#00f2fe" stroke-width="3" rx="2"
          filter="url(#nodeGlow)" />
        <path d="M 360 160 L 395 190 L 415 170 L 400 145 Z" fill="url(#nodeGrad)" filter="url(#nodeGlow)" />
        <polygon points="395,190 415,170 422,177 402,197" fill="#1e293b" />
        <line x1="360" y1="160" x2="385" y2="181" stroke="#ffffff" stroke-width="1.50" opacity="0.90" />
      </svg>
      <div class="brand-copy">
        <div class="brand-title">Sesi SVG Studio</div>
        <div class="brand-subtitle">Draw with code</div>
      </div>
    </div>
    <div class="server-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <main class="workspace">
    <section class="sidebar" aria-label="Drawing editor">
      <div class="panel-header">
        <div class="panel-title">
          <svg style="width:17px;height:17px;fill:currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
          </svg>
          Editor Configuration
        </div>
      </div>

      <div class="controls-group">
        <div class="stacked-control">
          <label for="svgPrompt">SVG Prompt</label>
          <input id="svgPrompt" class="text-input" type="text" placeholder="A neon owl in a storm of stars">
        </div>
        <div class="control-row">
          <div class="control-field">
            <label for="canvasPreset">Draw Preset</label>
            <select id="canvasPreset" class="select-input">
              <option value="neon_waves">Neon Sine Waves</option>
              <option value="cyber_sunset">Synthwave Sunset</option>
              <option value="geometric_mandala">Golden Mandala</option>
              <option value="pulsing_core">Pulsing Star Core</option>
              <option value="custom">Blank Canvas</option>
            </select>
          </div>
        </div>
        <div class="control-row">
          <div class="control-field">
            <label for="canvasWidth">Width (px)</label>
            <input type="number" id="canvasWidth" class="number-input" value="800" min="100" max="2000">
          </div>
          <div class="control-field">
            <label for="canvasHeight">Height (px)</label>
            <input type="number" id="canvasHeight" class="number-input" value="600" min="100" max="2000">
          </div>
        </div>
      </div>

      <div class="editor-container">
        <div class="editor-heading">
          <span>drawing.sesi</span>
          <span>SESI</span>
        </div>
        <div class="editor-wrapper">
          <div class="line-numbers" id="lineNumbers">1</div>
          <textarea id="codeEditor" class="code-textarea" spellcheck="false" autocomplete="off" aria-label="Sesi drawing code" placeholder="// Write Sesi drawing code here..."></textarea>
        </div>
      </div>

      <div class="action-row">
        <button class="secondary-btn" id="generateSvgBtn">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17,1.01L7,1C5.9,1 5,1.9 5,3V21C5,22.1 5.9,23 7,23H17C18.1,23 19,22.1 19,21V7L17,1.01M12,20C9.24,20 7,17.76 7,15C7,12.24 9.24,10 12,10C14.76,10 17,12.24 17,15C17,17.76 14.76,20 12,20M13.5,13H11V15.5H13.5V18H15V15.5H17.5V14H15V11.5H13.5V13Z" />
          </svg>
          Generate SVG from Prompt
        </button>
        <button class="render-btn" id="renderBtn">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
          </svg>
          Render Drawing
        </button>
      </div>
    </section>

    <section class="preview-panel" aria-label="SVG preview and execution output">
      <div class="canvas-container">
        <div class="stage-label">Live preview</div>

        <div class="canvas-actions" aria-label="Preview controls">
          <button class="action-btn" id="zoomInBtn" title="Zoom In" aria-label="Zoom In">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
          </button>
          <button class="action-btn" id="zoomOutBtn" title="Zoom Out" aria-label="Zoom Out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19,13H5V11H19V13Z" /></svg>
          </button>
          <button class="action-btn" id="resetZoomBtn" title="Reset View" aria-label="Reset View">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,4c-4.41,0-8,3.59-8,8s3.59,8,8,8,8-3.59,8-8-3.59-8-8-8zm0,14c-3.31,0-6-2.69-6-6s2.69-6,6-6,6,2.69,6,6-2.69,6-6,6z" /></svg>
          </button>
          <button class="action-btn" id="copySvgBtn" title="Copy SVG Code" aria-label="Copy SVG Code">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" /></svg>
          </button>
          <button class="action-btn" id="downloadBtn" title="Download SVG File" aria-label="Download SVG File">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" /></svg>
          </button>
        </div>

        <div class="canvas-card">
          <div class="checkerboard"></div>
          <div class="svg-wrapper" id="svgWrapper">
            <div class="empty-preview">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
              </svg>
              <div>Your SVG drawing will render here</div>
            </div>
          </div>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div class="loading-text" id="loadingText">Running Sesi Script...</div>
        </div>
      </div>

      <div class="console-panel">
        <div class="console-header">
          <span>Execution Output Terminal</span>
          <span id="clearConsoleBtn" role="button" tabindex="0">Clear Logs</span>
        </div>
        <div class="console-logs" id="consoleLogs">
          <div class="log-line log-info">Studio terminal ready. Select a preset or type Sesi code to begin drawing.
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Constants & State
    let zoomLevel = 1.0;
    let currentSvgData = "";

    const PRESETS = {
      neon_waves: `allow "std/draw" in as Draw
allow "std/math" in as Math

Draw.rect(0, 0, 800, 600, "#09090e")

// Set up linear gradient for the waves
Draw.gradient("linear", "waveGrad", [
  {"offset": "0%", "color": "#818cf8"},
  {"offset": "50%", "color": "#ec4899"},
  {"offset": "100%", "color": "#06b6d4"}
], {"x1": "0%", "y1": "0%", "x2": "100%", "y2": "0%"})

Draw.style("
  .wave {
    fill: none;
    stroke: url(#waveGrad);
    stroke-width: 2.5;
    opacity: 0.75;
  }
")

let waveCount = 8
let steps = 60
let i = 0

while i < waveCount {
  let points = ""
  let amplitude = 40.0 + i * 12
  let frequency = 0.015 - i * 0.001
  let phase = i * 0.8
  
  for step = 0 to (steps + 1) {
    let px = (step * 800.0) / steps
    let py = 300.0 + Math.sin(px * frequency + phase) * amplitude
    
    // Construct point string
    let coord = str(px) + "," + str(py)
    if step == 0 {
      points = coord
    } else {
      points = points + " " + coord
    }
  }
  
  Draw.polygon(points, "none", {"class": "wave", "opacity": str(1.0 - i * 0.12)})
  i = i + 1
}`,

      cyber_sunset: `allow "std/draw" in as Draw
allow "std/math" in as Math

// Dark starry sky background
Draw.rect(0, 0, 800, 600, "#0b0813")

// Sun Gradient
Draw.gradient("linear", "sunGrad", [
  {"offset": "0%", "color": "#f43f5e"},
  {"offset": "40%", "color": "#ec4899"},
  {"offset": "100%", "color": "#eab308"}
], {"x1": "0%", "y1": "0%", "x2": "0%", "y2": "100%"})

// Sun
Draw.circle(400, 200, 140, "url(#sunGrad)")

// Draw perspective grid lines
let y = 300
while y <= 600 {
  let progress = (y - 300) / 300.0
  let strokeW = 1.0 + progress * 2.5
  let opacity = progress * 0.8
  Draw.line(0, y, 800, y, "#06b6d4", {"stroke-width": strokeW, "opacity": opacity})
  y = y + 10 + Math.floor(progress * progress * 32)
}

let x = 0
while x <= 800 {
  Draw.line(x, 600, 400, 300, "#06b6d4", {"stroke-width": 1.5, "opacity": 0.3})
  x = x + 80
}

// Silhouette Skyscrapers
let skyline = [
  {"x": 50, "w": 80, "h": 160},
  {"x": 120, "w": 60, "h": 220},
  {"x": 200, "w": 90, "h": 140},
  {"x": 280, "w": 70, "h": 180},
  {"x": 480, "w": 80, "h": 200},
  {"x": 550, "w": 60, "h": 150},
  {"x": 600, "w": 100, "h": 240},
  {"x": 680, "w": 70, "h": 170}
]

for building in skyline {
  let bx = building["x"]
  let bw = building["w"]
  let bh = building["h"]
  let by = 350 - bh
  Draw.rect(bx, by, bw, bh, "#0b0813", {"stroke": "#f43f5e", "stroke-width": 1.5})
}`,

      custom: `allow "std/draw" in as Draw

// Start drawing your custom SVG here
Draw.rect(0, 0, 800, 600, "#111124")

Draw.circle(400, 300, 100, "#e94560")
Draw.text(400, 310, "Sesi Draw", 24, "#ffffff", {"text-anchor": "middle", "font-weight": "bold"})`
    };

    // DOM Elements
    const editor = document.getElementById("codeEditor");
    const lineNumbers = document.getElementById("lineNumbers");
    const presetSelect = document.getElementById("canvasPreset");
    const canvasWidth = document.getElementById("canvasWidth");
    const canvasHeight = document.getElementById("canvasHeight");
    const svgPrompt = document.getElementById("svgPrompt");
    const renderBtn = document.getElementById("renderBtn");
    const generateSvgBtn = document.getElementById("generateSvgBtn");
    const consoleLogs = document.getElementById("consoleLogs");
    const clearLogsBtn = document.getElementById("clearConsoleBtn");
    const svgWrapper = document.getElementById("svgWrapper");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");


    // Line numbers sync
    function updateLineNumbers() {
      const lines = editor.value.split('\n');
      const count = lines.length;
      let numberString = '';
      for (let i = 1; i <= count; i++) {
        numberString += i + '<br>';
      }
      lineNumbers.innerHTML = numberString;
    }

    editor.addEventListener('input', updateLineNumbers);
    editor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });

    // Preset selection loading
    presetSelect.addEventListener('change', () => {
      const val = presetSelect.value;
      if (PRESETS[val]) {
        editor.value = PRESETS[val];
        updateLineNumbers();
        logToTerminal("Loaded preset: " + presetSelect.options[presetSelect.selectedIndex].text, "info");
      }
    });

    // Terminal Logging
    function logToTerminal(message, type = "stdout") {
      const line = document.createElement("div");
      line.className = `log-line log-${type}`;

      const time = new Date().toLocaleTimeString();
      line.innerHTML = `[${time}] ${message}`;

      consoleLogs.appendChild(line);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    clearLogsBtn.addEventListener('click', () => {
      consoleLogs.innerHTML = "";
    });

    function displaySvg(svgText) {
      svgWrapper.innerHTML = svgText;

      const svg = svgWrapper.querySelector(':scope > svg');
      if (!svg) return;

      if (!svg.hasAttribute('viewBox')) {
        const width = parseFloat(svg.getAttribute('width'));
        const height = parseFloat(svg.getAttribute('height'));
        if (Number.isFinite(width) && width > 0 && Number.isFinite(height) && height > 0) {
          svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        }
      }

      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

      zoomLevel = 1.0;
      svgWrapper.style.transform = 'scale(1)';
    }

    // Zoom and Pan Controls
    document.getElementById("zoomInBtn").addEventListener('click', () => {
      zoomLevel += 0.15;
      svgWrapper.style.transform = `scale(${zoomLevel})`;
    });

    document.getElementById("zoomOutBtn").addEventListener('click', () => {
      if (zoomLevel > 0.3) {
        zoomLevel -= 0.15;
        svgWrapper.style.transform = `scale(${zoomLevel})`;
      }
    });

    document.getElementById("resetZoomBtn").addEventListener('click', () => {
      zoomLevel = 1.0;
      svgWrapper.style.transform = `scale(1.0)`;
    });

    // Copy SVG String
    document.getElementById("copySvgBtn").addEventListener('click', () => {
      if (!currentSvgData) {
        logToTerminal("No rendered SVG available to copy.", "error");
        return;
      }
      navigator.clipboard.writeText(currentSvgData)
        .then(() => logToTerminal("SVG XML copied to clipboard!", "success"))
        .catch(err => logToTerminal("Failed to copy SVG: " + err, "error"));
    });

    // Download SVG
    document.getElementById("downloadBtn").addEventListener('click', () => {
      if (!currentSvgData) {
        logToTerminal("No rendered SVG available to download.", "error");
        return;
      }
      const blob = new Blob([currentSvgData], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "sesi_drawing.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      logToTerminal("Downloaded SVG file: sesi_drawing.svg", "success");
    });

    // Render Request Execution
    function renderSvg() {
      const code = editor.value.trim();
      if (!code) {
        logToTerminal("Editor is empty. Type some drawing code first.", "error");
        return;
      }

      // Show spinner
      loadingOverlay.style.display = "flex";
      loadingText.textContent = "Compiling & executing Sesi script...";
      statusDot.className = "status-dot loading";
      statusText.textContent = "Running...";

      logToTerminal("Sending code to Sesi renderer...", "info");

      fetch("/render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: code,
          width: parseInt(canvasWidth.value) || 800,
          height: parseInt(canvasHeight.value) || 600
        })
      })
        .then(res => res.json())
        .then(data => {
          loadingOverlay.style.display = "none";
          statusDot.className = "status-dot";
          statusText.textContent = "Ready";

          if (data.error) {
            logToTerminal("Execution Error:\n" + data.error, "error");
            if (data.output) {
              logToTerminal("Stdout context:\n" + data.output, "stdout");
            }
          } else if (data.svg) {
            currentSvgData = data.svg;
            displaySvg(data.svg);
            logToTerminal("Sesi code compiled and executed successfully!", "success");
            if (data.output) {
              logToTerminal("Script stdout:\n" + data.output, "stdout");
            }
          } else {
            logToTerminal("Empty server response.", "warning");
          }
        })
        .catch(err => {
          loadingOverlay.style.display = "none";
          statusDot.className = "status-dot";
          statusText.textContent = "Error";
          logToTerminal("Network or Server error: " + err.message, "error");
        });
    }

    function generateSvgFromPrompt() {
      let description = svgPrompt.value.trim();
      const width = parseInt(canvasWidth.value) || 800;
      const height = parseInt(canvasHeight.value) || 600;
      description += ` (width: ${width}, height: ${height})`;
      if (!description) {
        logToTerminal("Enter a prompt before generating an SVG.", "error");
        return;
      }

      loadingOverlay.style.display = "flex";
      loadingText.textContent = "Generating SVG from prompt...";
      statusDot.className = "status-dot loading";
      statusText.textContent = "Generating...";

      logToTerminal("Sending prompt to SesiDo Agent...", "info");

      fetch("/generate-svg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description })
      })
        .then(res => res.json())
        .then(data => {
          loadingOverlay.style.display = "none";
          statusDot.className = "status-dot";
          statusText.textContent = "Ready";

          if (data.error) {
            logToTerminal("SVG Generation Error:\n" + data.error, "error");
            if (data.output) {
              logToTerminal("Stdout context:\n" + data.output, "stdout");
            }
            return;
          }

          if (data.svg) {
            currentSvgData = data.svg;
            displaySvg(data.svg);
            if (data.code) {
              editor.value = data.code;
              updateLineNumbers();
            }
            logToTerminal("SVG generated successfully.", "success");
            if (data.outputPath) {
              logToTerminal("Saved file: " + data.outputPath, "success");
            }
            if (data.output) {
              logToTerminal("Script stdout:\n" + data.output, "stdout");
            }
          }
        })
        .catch(err => {
          loadingOverlay.style.display = "none";
          statusDot.className = "status-dot";
          statusText.textContent = "Error";
          logToTerminal("Network or Server error: " + err.message, "error");
        });
    }

    renderBtn.addEventListener('click', renderSvg);
    generateSvgBtn.addEventListener('click', generateSvgFromPrompt);



    // Init
    editor.value = PRESETS.neon_waves;
    updateLineNumbers();
